app_id: middleware
name: Middleware Library
description: >
  Librería npm de estandarización de autenticación, formato de respuesta
  y manejo de errores para todos los microservicios Node.js (AdonisJS v5/v6,
  NestJS). Publicada como @smdv/middleware. Implementa dos modos de auth:
  gateway-trust (default, headers verificados por el gateway) y jwt-verify
  (defensa en profundidad, re-verifica JWT en el servicio). Todos los MS
  activos migraron a v1.1.4 en Jun 2026.
type: lib
status: active

